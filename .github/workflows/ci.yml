name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Check branch name and commit keys
        if: github.event_name == 'pull_request'
        run: |
          python scripts/check_commit_msgs.py \
            "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}" \
            "${{ github.head_ref }}"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest
